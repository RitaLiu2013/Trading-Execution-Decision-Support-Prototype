[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-execution-decision-support"
version = "0.1.0"
description = "Auditable trading-execution decision-support prototype combining deterministic analytics, data-quality controls, grounded RAG and evaluation."
license = {text = "MIT"}
authors = [{name = "Rita Liu"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "ollama>=0.4",
  "tabulate>=0.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[project.scripts]
trading-execution = "trading_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
