[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-execution-ai-prototype"
version = "0.1.0"
description = "Synthetic trading-execution analytics plus grounded RAG and deterministic routing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rita Liu"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "ollama>=0.4",
  "tabulate>=0.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[project.scripts]
trading-ai = "trading_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
